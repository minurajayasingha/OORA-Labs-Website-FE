<meta charset="utf-8" />
<title>{{ title }} | OORA Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ description }}" />
<meta name="author" content="OORA Labs" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://ooralabz.com/{{ path }}" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="OORA Labs" />
<meta property="og:title" content="{{ title }} | OORA Labs" />
<meta property="og:description" content="{{ description }}" />
<meta property="og:url" content="https://ooralabz.com/{{ path }}" />
<meta property="og:image" content="https://ooralabz.com/assets/images/Logo.svg" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ title }} | OORA Labs" />
<meta name="twitter:description" content="{{ description }}" />
<meta name="twitter:image" content="https://ooralabz.com/assets/images/Logo.svg" />

<!-- favicon -->
<link rel="shortcut icon" href="assets/images/favicon.svg" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" />

<!-- swiper  -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<!-- aos  -->
<link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

<!-- glight  -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
